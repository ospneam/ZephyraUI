[package]
name = "zephyra-ui"
description = "ZephyraUI widget layer: Buttons, Toggles, Cards, Dialogs and the rest, expressed as class names. Carries no backend and no app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# 这个 crate 是**库**，不是应用。
#
# # 它不依赖任何渲染后端
#
# 旧版本这里同时装着控件层和 gallery 应用，于是它依赖 `zephyra-winit-d3d12`
# 并有一个 `bin/gallery.rs`。代价是：库的使用者被迫拿到一整套图形栈依赖，
# 而「控件长什么样」与「谁把它画上屏」本就是两件事。
#
# 现在后端由**应用**（`gallery/`）用 feature 选，控件库只产出 `Element`。
#
# # 它也不含任何应用状态
#
# 路由、页面、i18n 文案表都不在这里 —— 那些属于 gallery。判据很简单：
# **换一个应用还能用吗？** Button 能，导航栏的路由表不能。
[dependencies]
zephyra-core = { path = "../zephyra/zephyra-core" }

# 控件的「排布」要断点与触控目标（`WidthClass` / `columns_for` / `touch_px`），
# 「随时间变化的外观」要缓动档位（`anim::Easing` / `step`）。两者都在框架层，
# 不在这里重实现 —— 那正是把它们放在 `zephyra/` 的原因。
zephyra-style = { path = "../zephyra/zephyra-style" }

# ⚠️ 控件的**文案**归 gallery，不归这里：同一个 Button 在不同应用里
# 叫 "确定" / "OK" / "Submit"。控件只发 key，文案表是应用的。
#
#    所以 `zephyra_core::i18n`（BCP47 / Messages）**不**在这里出现。

[lib]
name = "zephyra_ui"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"