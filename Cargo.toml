[workspace]
resolver = "2"
# `zephyra/` 分三层，依赖方向单向（上层不知道下层存在）：
#
#   zephyra-core   通用层（零依赖）：画什么 —— property/tree/layout/paint/input/icon
#      ↓ DisplayList（纯数据、可序列化、可断言）
#   zephyra-fx     效果器层：怎么把描述变成像素 —— 顶点展开/字形图集/光栅/资源复用
#      ↓ 顶点流 + 中立的资源需求
#   zephyra-base/  系统适配层：与操作系统直接打交道 —— D3D11 / D3D12 / DComp / 摄像头
#
# 效果器层与 base 并列而非放进 base，理由与 Skia 把 `src/effects` 放在与 `src/core`
# 并列处相同：效果**描述**是纯数据、零系统依赖，而效果**执行**才需要 GPU。
# 前者能进 core 与效果器层，后者必须留在 base。
members = [
    "zephyra/zephyra-core",
    "zephyra/zephyra-fx",
    "zephyra/zephyra-style",
    "zstylec",
    # 命令行前端。与 zstylec 同一个 workspace —— 而不只是路径依赖邻居 ——
    # 所以「CLI 看到的属性表」与「编译器看到的属性表」不可能是两份。
    "ZephyraCLI",
    "zephyra/zephyra-base/zephyra-winit",
    "zephyra/zephyra-base/zephyra-winit-d3d12",
    "zephyra/zephyra-base/extra/zephyra-camera",
    "zephyra/zephyra-base/zephyra-dcomp",
    # 平台能力抽象 + Windows 实现。`zephyra-platform` 本身**不含平台代码**
    # （可进 default-members，但暂无独立产物需要默认构建，故一并归到"按需选"）。
    # `zephyra-platform-win` 含 Win32 API，与 dcomp/camera 同一条理由不进
    # default-members：默认构建不该出现 unsafe 与 COM 边界。
    "zephyra/zephyra-base/zephyra-platform",
    "zephyra/zephyra-base/zephyra-platform-win",
    # Linux 实现：与 `zephyra-platform-win` **同级**，两个平台互不认识。
    # 同一条理由不进 default-members（"按需选"），但它一行 unsafe 都没有，
    # 见 Cargo.toml 的说明。
    "zephyra/zephyra-base/zephyra-platform-linux",
    # Linux 渲染后端（winit + 裸 Vulkan/ash，**不用 wgpu**）。与两个 Windows 后端互不依赖 —
    # 理由逐条相同（D3D11 / D3D12 / Vulkan 是三套不同的词汇，硬并会让 `#[cfg]`
    # 分支淹没真正的逻辑）。同样不进 default-members：默认构建不该编译另一套图形栈。
    # （wgpu 版 zephyra-winit-vk 已删除 —— 用户明确要求不用 wgpu，raw ash 全链路实测通过。）
    "zephyra/zephyra-base/zephyra-vulkan",
    # ---- extra ----
    #
    # `extra/` 是"不是所有项目都需要"的包的存放处。两个位置按**判据**分：
    #
    #   zephyra-core/extra/     零依赖 + 无 GPU 可单测的纯逻辑
    #   zephyra-base/extra/     要碰平台 / 允许 unsafe 的
    #
    # 判据与 `zephyra-base/README.md` 的分层判据同源。
    # `zephyra-camera` 原本住在 base 根目录，现已归入 base/extra/ —— 它正是
    # 这一层的样板：`default = []`，开 `capture` 才带 nokhwa。
    "zephyra/zephyra-core/extra/zephyra-bezier",
    # 控件层（库）。**不依赖任何渲染后端** —— 后端由应用用 feature 选。
    # 不进 default-members：它要编完整套控件，且对框架自身没有用处。
    "ZephyraUI",
    # gallery —— `ZephyraUI` 控件层的参考应用。与控件层分开是因为它要选
    # 渲染后端（d3d12 / d3d11 / linux-vk 互斥），而控件层零后端依赖。
    # 同样不进 default-members：它编一整套应用。
    "gallery",
    "examples",
]
# `extra/` 下的包（`zephyra-bezier` / `zephyra-camera`）与 `zephyra-dcomp` 进 members
# 但**不进** default-members：它们是成员（可以被 `-p` 选中、共享工作区的依赖解析），
# 但不会被无差别的 `cargo build` / `cargo test` 编译。这就是"选择编译"落在 Cargo
# 层面的形式——比在源码里 `#[cfg]` 一大块更细，因为连依赖解析都省掉了。
#
# `zephyra-dcomp` 排除的理由比 camera 更强一层：它需要 `unsafe`（COM / DXGI），
# 放进 default-members 会让"无差别构建"这个动作本身开始编译 unsafe 代码。
#
# `zephyra-winit-d3d12` 同样不在 default-members，理由基本相同：它是 D3D12 后端，与
# `zephyra-winit`（D3D11）是**两个独立 crate**，同一个二进制里只应有一个后端。
# 无差别构建时两个都编，既慢，又让"这次改动影响了哪个后端"变得不清楚。用 `-p` 选。
default-members = [
    "zephyra/zephyra-core",
    "zephyra/zephyra-fx",
    "zephyra/zephyra-base/zephyra-winit",
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.87"
