[package]
name = "zephyra-winit"
description = "winit + wgpu host adapter for ZephyraUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 目标宿主：winit 拿窗口与事件，wgpu 拿表面与渲染。
#
# 与 zephyra-iced 的关系是**互斥的两条迁移路径**，不是二选一的运行时开关：
# 框架最终跑在 winit+wgpu 上，iced-fork 是过渡期。
[dependencies]
zephyra = { path = "../zephyra" }

[lints.rust]
unsafe_code = "forbid"
