[package]
name = "zephyra-winit"
description = "winit + D3D11 host adapter for ZephyraUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 目标宿主：winit 拿窗口与事件，D3D11 拿设备与呈现。
#
# # 为什么不用 wgpu（这是本 crate 最重要的一次取舍，2026-10 实测定案）
#
# wgpu 的 DX12 后端在 `request_device` 内部就吃掉 262 MB 私有内存，且**无法**靠
# 调 limits/features 压下去 —— 逐项实测（Intel UHD，Windows 11）：
#
#   | 路径                                        | 进程私有内存 |
#   |---------------------------------------------|--------------|
#   | wgpu `request_device` 之后                   | 281 MB       |
#   | 再编译真实 shader + pipeline                  | 282 MB (+0.6)|
#   | 原生 D3D12（工厂→设备→队列→围栏）            | 24 MB        |
#   | 原生 D3D11（设备→交换链→图集→采样器）        | **11.7 MB**  |
#
# 262 MB 里约 61 MB 来自 `max_non_sampler_bindings`（wgpu 默认 1,000,000，wgpu-hal
# 按它开 CBV_SRV_UAV 描述符堆），剩下约 200 MB 是 gpu_allocator 的 D3D12 子分配器
# 初始化，不随任何 limit 变化。
#
# 所以「降 limit 省内存」最多省 61 MB，而**换掉 wgpu 能省 269 MB** —— 后者才是值得
# 付的代价。D3D11 顺带还赢在三处：
#
# - API 简单得多：没有堆 / 描述符堆 / 屏障 / 命令列表，立即上下文自动提交；
# - DComp 更好接：D3D11 device 能 QI `IDXGIDevice`（本机 D3D12 device **不能**，
#   见 `zephyra-dcomp` 硬约束 #2），所以那条 v2→v3→null fallback 链不再是必需品；
# - 绑定纹理不再需要 bind group 缓存 —— D3D11 直接 `PSSetShaderResources`，
#   纹理生命周期那种"缓存指向已销毁纹理"的整类 bug 随之消失。
#
# 代价：本 crate 的渲染器目前**只有 Windows/D3D11 一条路**。Linux 侧需要另一个
# 后端（Vulkan 或软件光栅），尚未实现 —— 非 Windows 平台会 `compile_error!` 并说明
# 原因，而不是静默退化成"能编译但不出画面"。
#
# # 为什么这里解除 `forbid(unsafe_code)`
#
# base 层是系统适配层。整条 D3D11/DXGI/DComp 链路都是 FFI。
#
# 通用层（`zephyra/zephyra-core`）的 `forbid(unsafe_code)` **不动**：那条约束才是
# 「宿主迁移时不必搬核心」的前提。见 zephyra/zephyra-base/README.md。

[dependencies]
zephyra-core = { path = "../../zephyra-core" }
zephyra-fx = { path = "../../zephyra-fx" }
winit = "0.30"
# 顶点结构用 bytemuck 的 Pod/Zeroable derive，省掉手写字段校验。
bytemuck = { version = "1", features = ["derive"] }
# 文本栈：字体解析 + 字形度量 + 栅格化。
#
# 选 ab_glyph 而不是 cosmic-text / swash：它只做 OpenType 解析 + 栅格化，不含
# GSUB/GPOS 整形、连字与双向文本。UI 的绝大多数标签是简单文本，缺整形的代价远小于
# 依赖树的代价 —— 而依赖树越大，"核心零依赖"这条约束的验证就越脆弱。
#
# 若将来确实需要复杂整形（阿拉伯语、印地语、连字），换引擎即可：`TextEngine` 是
# trait，核心侧一行不用改。
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
zephyra-dcomp = { path = "../zephyra-dcomp" }
# D3D11 渲染 + DXGI 呈现。
#
# 版本必须与 `zephyra-dcomp` 一致（都是 0.62）—— COM 接口类型要互相 cast 就得来自
# 同一个 crate 的同一次编译。版本错配唯一的"解法"是跨 crate 的指针强转，而那是把
# 配置错误伪装成一次 unsafe。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
# 从 winit 窗口取裸 HWND。winit 0.30 的 `Window::window_handle()` 返回
# `raw_window_handle::WindowHandle`，而要用就必须能命名那个 trait。
raw-window-handle = "0.6"

[lints.rust]
# 通用层的 forbid 在这里**有意不写**，理由见文件头。
unsafe_code = "allow"
