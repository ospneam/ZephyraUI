[package]
name = "zephyra-dcomp"
description = "DirectComposition presentation backend for ZephyraUI hosts: DComp device/target/visual tree and composition swapchain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 为什么是独立 crate，且**不在 default-members 里**
#
# 这是本仓第二个"可选子包"（第一个是 zephyra-camera）。放在 workspace
# `members` 但排除出 `default-members`，理由与 camera 一致：无差别的
# `cargo build` / `cargo test` 不该编译设备相关代码。
#
# 但理由更强一层 —— 本 crate 用了 `unsafe`（COM / DXGI），而 `zephyra/zephyra-core`
# 与 `zephyra/zephyra-core-winit` 都是 `unsafe_code = "forbid"`。放进 default-members
# 会让「无差别构建」这个动作本身开始编译 unsafe 代码。
#
#   cargo build                    # 不碰本 crate（零依赖核心仍然干净）
#   cargo test  -p zephyra-dcomp    # 显式构建；纯逻辑断言在 CPU 上跑
#   cargo test  -p zephyra-dcomp --test smoke   # 需要真实窗口 + GPU
#
# 本 crate 不依赖 `zephyra-core`：DirectComposition 与 DXGI 是 Win32 词汇，与 UI 框架
# 词汇无关。宿主（zephyra-winit / zephyra-winit-d3d12）同时依赖两者，由它接线。
[dependencies]
# 合成失败要能被看见：null rendering device fallback 是实测结论，静默失败会让
# 窗口停在空白而无任何提示。
log = "0.4"

# `windows` 的 feature 集合刻意不增不减：增一个 feature 就多一批可能编译不过的
# 绑定面，而本 crate 只用 DComp + DXGI。
#
# 版本必须与两个宿主 crate 一致（都是 0.62）
#
# 两个宿主都要把本 crate 的 `IDXGISwapChain1` 接进自己的设备与命令队列。两个
# `windows` 大版本的 COM 类型**互相不认识**（各自的 `ID3D12Resource` 是不同类型，
# `cast()` 不存在），只能在指针层面强转 —— 那是一次跨 crate 边界的 unsafe，病因在
# 版本错配而不是任何一段代码。所以这里与宿主对齐版本，让"接得上"这件事由类型系统
# 保证。
[target.'cfg(windows)'.dependencies]
# `IDCompositionVisual2::SetTransform2` 的入参类型就是 `windows_numerics::Matrix3x2`，
# 而 `windows` 只**转发**这个类型、不重导出 —— 所以要直接依赖它才能把矩阵传进去。
# 它是 `windows` 的同仓子 crate，本就��� `Cargo.lock` 里，不引入额外下载。
windows-numerics = "0.3"

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# smoke 测试要真建窗口，因此额外需要 D3D / GDI / COM / 动态库装载四个 feature。
# 只在 dev-dependencies 里 —— 它们不进正式产物。
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }
