[package]
name = "zephyra-foundation"
description = "Executable acceptance criteria for the ZephyraUI core, plus a windowed demo app"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
zephyra-core = { path = "../zephyra/zephyra-core" }
# 后端无关的渲染层。`--dump-cpu` 那条路（`CpuHost`、图集、顶点流）**不需要任何 GPU
# 后端**，而 `zephyra-winit` / `zephyra-winit-d3d12` 只是把这一层重新导出了一遍。
#
# 直接依赖它而不是走再导出：`--dump-cpu` 的意义就是「不开窗口也能验证整条链」，
# 而一旦它依赖某个后端 crate，那条路就会跟着后端一起坏 —— 那正好是它要躲开的东西。
zephyra-fx = { path = "../zephyra/zephyra-fx" }
# dev 模式下直接解析样式表文本（release 侧不该链它，见 zstylec 的文档）
zstylec = { path = "../zstylec" }
zephyra-style = { path = "../zephyra/zephyra-style" }
# 演示宿主：真开窗口 + GPU 渲染（Linux 上是 wgpu/Vulkan）。
#
# # 只有一个后端会被编进来
#
# 由**特性开关**选择（`d3d12` / `d3d11`），而不是运行时切换 —— 两个都编进来时，
# 画面一空就分不清是哪个后端的静默失效，而这两种要查的完全不同。
#
# 默认 `d3d12`：它的外壳与呈现链路已逐档验证（见 `zephyra-winit-d3d12/tests/`）。
zephyra-winit-d3d12 = { path = "../zephyra/zephyra-base/zephyra-winit-d3d12", optional = true }
zephyra-winit = { path = "../zephyra/zephyra-base/zephyra-winit", optional = true }
# Linux 后端：裸 Vulkan（ash），**不用 wgpu**。wgpu 版（zephyra-winit-vk）已废弃。
zephyra-vulkan = { path = "../zephyra/zephyra-base/zephyra-vulkan", optional = true }
# `Bootstrap` 自举宿主时要实现 `ApplicationHandler`，所以本 crate 直接依赖 winit ——
# 而不是走 `zephyra_winit::winit` / `zephyra_winit_d3d12::winit` 的再导出。
#
# 走再导出看起来「少一个依赖」，但它让「本示例用的 winit 版本」取决于选中了哪个后端，
# 而两个后端版本必须一致（`ApplicationHandler` 是同一个类型）。直接依赖把这件事变成
# 显式的。
winit = "0.30"
#
# 这里**不再**有 pollster：wgpu 的设备请求是 async 的，需要一个 block_on 才能塞进
# 同步的 `main`；D3D11/D3D12 的设备与交换链本来就是同步 API，所以那个依赖消失了。

[features]
default = ["d3d12"]
d3d12 = ["dep:zephyra-winit-d3d12"]
d3d11 = ["dep:zephyra-winit"]
# Linux 后端（winit + wgpu/Vulkan）。与上面两个**互斥**：同一个二进制只编一个后端，
# 理由见 `zephyra-winit-d3d12/Cargo.toml` 的文件头。
#
# ⚠ `default` 仍然是 `d3d12`，而 d3d12 在 Linux 上是空 crate（`#![cfg(windows)]`）——
# 所以 Linux 上的命令是 `--no-default-features --features linux-vk`。
# 那两个 flag 缺一个的后果不一样：只给 `--features linux-vk` 会**同时**编进
# d3d12（空）与 linux-vk，于是 Linux 上跑起来的是「两个后端都存在」，而画面由
# `#[cfg]` 选中的那个出 —— 能跑，但多编一遍 D3D12 那条依赖链。
linux-vk = ["dep:zephyra-vulkan"]

[[bin]]
name = "foundation"
path = "foundation.rs"

[[bin]]
name = "demo"
# ⚠ 这里**不再**有 `required-features`。
#
# 原来写的是 `required-features = ["d3d12"]`：那时 `demo.rs` 只在 d3d12 下编得过
# （d3d11 那条路的 `#[cfg]` import 会切到 D3D11 的 `HostWindow`，而 required-features
# 已经把这个 bin 挡在 d3d11 之外了）。Linux 适配之后这条路走不通：Cargo 的
# `required-features` 是**与**语义、表达不了「d3d12 或 linux-vk」，而 d3d12 在 Linux
# 上是空 crate —— 照原样写等于这个 bin 在 Linux 上**永远不存在**。
#
# 所以改成「bin 恒可编，后端由 `demo.rs` 里的 `#[cfg(feature)]` 分流」，没开任何
# 后端 feature 时 `main()` 打印一行提示并退出。这与仓库既有的「选哪后端留在命令里」
# 一致，而且省掉了「Linux 上 d3d12 是空 crate 却仍是默认 feature」这个陷阱。
path = "demo.rs"

# hover / press 的端到端断言。不需要窗口也不需要 GPU —— 链路止于 DisplayList。
[[test]]
name = "demo_interaction"
path = "demo_tests.rs"
